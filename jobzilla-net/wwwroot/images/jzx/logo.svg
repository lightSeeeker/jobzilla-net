<svg xmlns="http://www.w3.org/2000/svg" width="210" height="48" viewBox="0 0 210 48" fill="none" role="img" aria-label="Fursanet">
  <defs>
    <linearGradient id="fnMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fnNet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <rect x="2" y="4" width="40" height="40" rx="12" fill="url(#fnMark)"/>
  <!-- stylised F + rising spark -->
  <rect x="14" y="12" width="7" height="24" rx="3" fill="#ffffff"/>
  <rect x="14" y="12" width="18" height="7" rx="3" fill="#ffffff"/>
  <rect x="14" y="22" width="13" height="7" rx="3" fill="#ffffff"/>
  <circle cx="34" cy="15.5" r="3.5" fill="#A7F3D0"/>

  <!-- wordmark -->
  <text x="52" y="32" font-family="'Space Grotesk','Segoe UI',system-ui,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#0F172A">Fursa</tspan><tspan fill="url(#fnNet)">net</tspan>
  </text>
</svg>
